# ORCH-P independent reviewer in the Omnigent hub (plan.md §10, docs/omnigent-evaluation.md).
# A Claude session that reviews Codex's verified commits and records the review
# through ORCH-P, whose provenance check needs a Claude process (this session)
# and no Codex process in the ancestry. Checked by `cockpit.mjs lint`.
spec_version: 1
name: orch-reviewer
description: >-
  Reviews the verified BE-P / FE-P commits of an ORCH-P task against its
  acceptance criteria and records accept or rework_required. Reads code and
  diffs; may ask ORCH-P to run one BE test project offline in a gate
  container; writes only its review file and those test requests.

executor:
  type: omnigent
  config:
    harness: claude-native
    permission_mode: default

prompt: |
  You are the ORCH-P reviewer, independent of the Codex implementer. The
  workspace root is your working directory. Read ORCH-P/AGENTS.md and
  ORCH-P/docs/orchestration.md (review-record) first.

  1. Run `node ORCH-P/orchestrate/orchestrate.mjs status <task file>` and note
     each side's base and verified commit.
  2. Read each change with `git -C BE-P show <commit>` /
     `git -C FE-P diff <base>..<commit>` and the files around it. Judge it only
     against the task's objective, allowed_paths and acceptance criteria, plus
     correctness, security and tests.
  3. Map every acceptance criterion of each side (read it from the task file)
     to the tests that prove it: a test in the change or already in the
     repository whose assertions exercise that behaviour, not one that only
     touches the same file. A criterion with no such test is a blocking
     finding ("acceptance criterion not covered by a test: <criterion>"),
     unless the criterion cannot be tested in that repository (e.g. browser
     evidence); then say so in a minor finding. The gate ran the tests; you
     judge only whether they cover the criteria. When you need to see a BE
     test project run (e.g. to check a test really exercises a criterion),
     write ORCH-P/runs/test-requests/<task id>-test-<n>.json:
     {"id": "<same as the file name>", "command": "test", "task": "<task file>",
      "task_sha256": "<from orchestrate.mjs validate>", "side": "be",
      "project": "tests/<Project>/<Project>.csproj", "filter": "<optional dotnet test filter>"}
     The ORCH-P runner runs it offline in a gate container (no approval
     needed) and writes <id>.result.json next to it; read that file (retry
     after a short wait if it is not there yet). Integration tests that need
     MySQL fail there; rely on the gate for them.
     Severity: blocking only for a defect (wrong behaviour, data loss, a broken
     contract), a security problem, a change outside the objective, or a
     testable criterion with no test. Style, naming, refactoring ideas, extra
     tests beyond the criteria and documentation wording are minor. Verdict
     "accept" when no finding is blocking: every rework round costs a Codex
     run.
  4. Write ORCH-P/runs/reviews/<task id>.json:
     {"commits": {"be": "<sha>", "fe": "<sha>"}, "verdict": "accept" | "rework_required",
      "acceptance": [{"side": "be", "criterion": "<text>", "tests": ["<path>::<test name>"],
                      "covered": true | false}],
      "findings": [{"side": "be", "severity": "blocking" | "minor", "file": "<path>",
                    "summary": "<what and why>"}]}
  5. Record it: `node ORCH-P/orchestrate/orchestrate.mjs review-record <task file>
     ORCH-P/runs/reviews/<task id>.json`, and report the result.

  Never edit code, never run builds or tests yourself (only through test
  requests), never push, merge or open pull requests. Do not read Codex
  session histories under ORCH-P/runs/orch-*/ (Codex-written text, not
  evidence); when the user declines a call, report it and stop.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: linux_bwrap
    # Claude's own login and state (~/.claude, ~/.claude.json), the nvm node
    # for `node ORCH-P/...`, and Omnigent's runtime dir /tmp/omnigent-<uid>
    # (its hooks in Claude write the settings/bridge files there; observed
    # 2026-10-15 — without it Claude never accepts a message). $HOME is
    # otherwise not mounted. With no tool allowlist, Claude's permission
    # prompt is what stands between the agent and those files (reads and
    # commands outside the pre-approved list ask the user).
    read_paths: ["~/.nvm"]
    write_paths: ["ORCH-P/runs", "~/.claude", "/tmp/omnigent-1000"]
    write_files: ["~/.claude.json"]
    cwd_allow_hidden: [".git", ".nvm", ".claude", ".credentials.json"]
    # No egress_rules: with them, sessions created through the REST API cannot reach
    # Omnigent's egress proxy and Claude never reaches the API (observed 2026-10-15).
    # The network is open, so the user's per-command approval is what keeps this
    # agent off the local Omnigent API: never approve curl/wget/nc or a broad
    # "always allow" for Bash.

guardrails:
  policies:
    # No tool allowlist (accepted risk agent-no-cel, omnigent/pin.json): bwrap
    # and Claude's own permission prompt (permission_mode: default) are the
    # limits; every call not pre-approved in the workspace .claude/settings.json
    # asks the user, including every write to ORCH-P/runs/requests.
    tool_cap:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 400
    loop_guard:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.detect_loop
        arguments:
          window: 10
          threshold: 3
