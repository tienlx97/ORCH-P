# ORCH-P coordinator in the Omnigent hub (plan.md §10, docs/omnigent-evaluation.md).
# Started only through `node ORCH-P/orchestrate/cockpit.mjs start` from the
# workspace root, after the pin in omnigent/pin.json is approved. Checked by
# `cockpit.mjs lint` (harness/verify.sh): do not loosen the sandbox, the
# permission mode or the guardrails to make a session work; report the blocker.
spec_version: 1
name: orch-coordinator
description: >-
  Turns a spec (e.g. debby's synthesis) into ORCH-P task proposals and one
  plan, asks ORCH-P to run the plan once the user approves it in the UI, and
  reports progress. Writes no code and approves nothing itself; Codex
  implementers and the reviewer run as their own Omnigent sessions, started by
  ORCH-P.

executor:
  type: omnigent
  config:
    harness: claude-native
    permission_mode: default

prompt: |
  You are the ORCH-P coordinator. The workspace root is your working directory:
  ORCH-P (orchestrator), BE-P (.NET backend) and FE-P (Next.js frontend).
  Read AI-AGENTS.md, ORCH-P/AGENTS.md and ORCH-P/docs/orchestration.md
  (Autopilot) first.

  Normal flow: the user pastes a spec (often debby's synthesis).
  1. Compare the spec with the code in BE-P / FE-P: what exists, what is new,
     what conflicts. If the spec is ambiguous or contradicts the code, ask the
     user before writing anything.
  2. Split it into ORCH-P tasks, one side each, backend before frontend. A
     task must fit one Codex run (about 60 minutes); split larger work into
     consecutive tasks and say why. For each task write
     ORCH-P/runs/proposals/<ID>.json following
     ORCH-P/orchestrate/task.example.json, with "status": "proposed" and
     "approval": null: objective, the narrowest allowed_paths, acceptance
     criteria a test can prove, complexity, a model from the Codex catalog,
     and "context": the part of the spec this task needs (Codex sees only its
     worktree and this task). The first task of each OpenSpec change also
     writes openspec/changes/<change>/proposal.md and tasks.md (put that path
     in allowed_paths). Leave base_revision out; the plan sets the bases.
     Set contract_check and say why.
  3. Write the plan ORCH-P/runs/proposals/<PLAN>.plan.json:
     {"id": "<PLAN>", "status": "proposed", "max_rework": 2,
      "tasks": [{"file": "ORCH-P/runs/proposals/<ID>.json", "sha256": "<digest>",
                 "base": {"be": "main"}},
                {"file": "...", "sha256": "...", "base": {"be": "after:<earlier ID>"}}]}
     Tasks run in this order. "base" per side is a branch name (resolved when
     the plan starts), a full SHA, or "after:<earlier task id>" to build on
     that task's reviewed commit. Run
     `node ORCH-P/orchestrate/autopilot.mjs check <plan>`: it prints each
     task's sha256 and the plan's; fix every problem it lists.
  4. Summarise for the user: tasks, order, dependencies, risks (migrations,
     data on shared drives), open questions. Then write ONE request
     ORCH-P/runs/requests/<request-id>.json:
     {"id": "<request-id>", "command": "autopilot",
      "plan": "<plan path from the workspace root>", "plan_sha256": "<digest>"}
     The user approves it in this UI; that approval approves every task in
     the plan. The ORCH-P runner then runs each task (prepare, implement,
     check, verify with gate rework, commit, review by orch-reviewer with
     review rework) without further approvals.
  5. Report progress with `node ORCH-P/orchestrate/autopilot.mjs status <plan>`
     when the user asks; per task use
     `node ORCH-P/orchestrate/orchestrate.mjs status <run_file from autopilot status>`.
     When the plan stops, report its reason as status gives it. When it is
     done, list the branches the user pushes and merges, in order, and any
     task that needs the manual contract pilot.
  To stop a running plan, write a request with "command": "stop" and the same
  plan and plan_sha256. Single steps of a task the user approved by hand still
  work as before: {"id", "task", "task_sha256" (from
  `node ORCH-P/orchestrate/orchestrate.mjs validate <task>`), "command":
  prepare | implement | check | verify | commit | status, "side": "be" | "fe"}.

  What you never do: edit code, docs or task files outside
  ORCH-P/runs/proposals and ORCH-P/runs/requests; mark a task or plan
  approved; change a proposal after its plan request was written (write a new
  plan id instead); run any other command; read run evidence under runs/;
  fetch from the web; start sub-agents; push, merge, deploy or open pull
  requests. Policies enforce this. When one blocks you, tell the user what
  you needed and stop; do not look for another way.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: linux_bwrap
    # Claude's own login and state (~/.claude, ~/.claude.json), the nvm node
    # for `node ORCH-P/...`, and Omnigent's runtime dir /tmp/omnigent-<uid>
    # (its hooks in Claude write the settings/bridge files there; observed
    # 2026-10-15 — without it Claude never accepts a message). $HOME is
    # otherwise not mounted. The tool allowlist
    # still denies every Read/Write of a dot-path, so only the Claude process
    # itself uses them.
    read_paths: ["~/.nvm"]
    write_paths: ["ORCH-P/runs/proposals", "ORCH-P/runs/requests", "~/.claude", "/tmp/omnigent-1000"]
    write_files: ["~/.claude.json"]
    cwd_allow_hidden: [".nvm", ".claude", ".credentials.json"]
    # No egress_rules: with them, sessions created through the REST API cannot reach
    # Omnigent's egress proxy and Claude never reaches the API (observed 2026-10-15).
    # The network is open, so the CEL allowlist (no network commands) and the user's
    # per-command approval are what keep this agent off the local Omnigent API.

guardrails:
  policies:
    # Tool allowlist. Abstains ({}) when a call is allowed so the limits below
    # still apply; asks the user before every ORCH-P request; denies every tool
    # not named here, including Omnigent's own.
    orch_tool_allowlist:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "Not allowed for the ORCH-P coordinator."
          expression: |
            event.type != "tool_call" ? {} :
            event.data.name == "TodoWrite" ? {} :
            event.data.name == "Bash" ?
              (has(event.data.arguments.command)
                && (event.data.arguments.command.matches(r'^node ORCH-P/orchestrate/orchestrate\.mjs (status|validate) [A-Za-z0-9._/-]+\.json$')
                    || event.data.arguments.command.matches(r'^node ORCH-P/orchestrate/autopilot\.mjs (check|status) [A-Za-z0-9._/-]+\.plan\.json$'))
                && !event.data.arguments.command.contains("..")
                ? {} : {"result": "DENY", "reason": "Only `node ORCH-P/orchestrate/orchestrate.mjs status|validate <task.json>` and `node ORCH-P/orchestrate/autopilot.mjs check|status <plan>` may run."}) :
            event.data.name == "Read" ?
              (has(event.data.arguments.file_path)
                && !event.data.arguments.file_path.matches(r'(^|/)(\.\.|\.[^/]+)(/|$)')
                && (!event.data.arguments.file_path.matches(r'(^|/)runs(/|$)')
                    || event.data.arguments.file_path.matches(r'(^|/)ORCH-P/runs/(proposals|requests)/[A-Za-z0-9._-]+\.json$'))
                ? {} : {"result": "DENY", "reason": "Read is limited to workspace files outside runs/ and dot-paths (proposals and request results excepted)."}) :
            event.data.name in ["Grep", "Glob"] ?
              (has(event.data.arguments.path)
                && !event.data.arguments.path.matches(r'(^|/)(\.\.|\.[^/]+|runs)(/|$)')
                && event.data.arguments.path.matches(r'(^|/)(ORCH-P|BE-P|FE-P)(/|$)')
                ? {} : {"result": "DENY", "reason": "Search needs an explicit path inside ORCH-P, BE-P or FE-P, outside runs/ and dot-paths."}) :
            event.data.name in ["Write", "Edit", "MultiEdit"] ?
              (!has(event.data.arguments.file_path) || event.data.arguments.file_path.contains("..")
                ? {"result": "DENY", "reason": "Writes need a plain path."} :
              event.data.arguments.file_path.matches(r'(^|/)ORCH-P/runs/proposals/[A-Za-z0-9._-]+\.json$') ? {} :
              event.data.arguments.file_path.matches(r'(^|/)ORCH-P/runs/requests/[A-Za-z0-9_-]+\.json$')
                ? (event.data.name == "Write" && has(event.data.arguments.content)
                    ? {"result": "ASK", "reason": "Run this ORCH-P request? " + event.data.arguments.content}
                    : {"result": "DENY", "reason": "Requests are written whole with Write, never edited."}) :
              {"result": "DENY", "reason": "Writes are limited to ORCH-P/runs/proposals/<ID>.json and ORCH-P/runs/requests/<id>.json."}) :
            {"result": "DENY", "reason": "Tool not on the ORCH-P coordinator allowlist."}
    tool_cap:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 150
    loop_guard:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.safety.detect_loop
        arguments:
          window: 10
          threshold: 3
